name: Feature request
description: Suggest a focused WMCS improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest native OpenWrt-based solution you would find useful.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: WMCS principles
      options:
        - label: This does not put WMCS in the packet or radio datapath.
          required: true
        - label: This preserves configuration WMCS does not own.
          required: true
        - label: This keeps Freenetic integration at the documented ubus boundary.
          required: true
